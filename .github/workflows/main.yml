name: Build Fabric Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - run: chmod +x ./gradlew
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: Hotbar-Toggle-Fabric-26.2
          path: build/libs/hotbar-toggle-1.0.0.jar
